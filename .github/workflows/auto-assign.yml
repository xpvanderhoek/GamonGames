name: Auto Assign & Label PR

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR approvals and assign/label
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const pr = context.payload.pull_request;

            // 1️⃣ Tel alle approvals
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const latestReviews = {};
            for (const review of reviews.data) {
              latestReviews[review.user.login] = review.state;
            }

            const approvals = Object.values(latestReviews)
              .filter(state => state === "APPROVED").length;

            console.log("Aantal approvals:", approvals);

            // 2️⃣ Als er minder dan 2 approvals zijn, doe de setup
            if (approvals < 2) {
              // 🔹 Voeg label toe als nog niet aanwezig
              const existingLabels = pr.labels.map(l => l.name);
              if (!existingLabels.includes("needs-review")) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: ["needs-review"]
                });
              }

              // 🔹 Assign PR creator als nog niet assigned
              const assignees = pr.assignees.map(a => a.login);
              if (!assignees.includes(pr.user.login)) {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  assignees: [pr.user.login]
                });
              }
            } else {
              console.log("PR heeft al 2 of meer approvals, niets doen ✅");
            }
