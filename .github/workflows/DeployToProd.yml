name: Build & Deploy Godot Game

on:
  workflow_dispatch:

jobs:
  # ──────────────── Non-Production Build ────────────────
  build-non-prod:
    runs-on: ubuntu-latest
    environment: Non-Production  # approval knop kan hier ook als je wilt
    defaults:
      run:
        working-directory: gamon-games  # alles draait in de subfolder

    steps:
      # 1️⃣ Checkout repo
      - uses: actions/checkout@v4

      # 2️⃣ Download en setup Godot
      - name: Download Godot
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip Godot_v4.2.2-stable_linux.x86_64.zip
          mv Godot_v4.2.2-stable_linux.x86_64 ../godot
          chmod +x ../godot

      # 3️⃣ Install export templates
      - name: Install export templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          unzip Godot_v4.2.2-stable_export_templates.tpz -d templates
          mv templates/templates/* ~/.local/share/godot/export_templates/4.2.2.stable/

      # 4️⃣ Maak build folder
      - name: Create build folder
        run: mkdir -p build

      # 5️⃣ Build Windows
      - name: Build Windows
        run: ../godot --headless --export-release "Windows Desktop" build/game.exe

      # 6️⃣ Upload artefact voor later gebruik
      - uses: actions/upload-artifact@v4
        with:
          name: non-prod-build
          path: gamon-games/build/

  # ──────────────── Promote to Production ────────────────
   promote-to-prod:
    needs: build-non-prod
    runs-on: ubuntu-latest
    environment: Production  # approval knop hier

    steps:
      # 1️⃣ Download artefact van Non-Prod
      - name: Download build from Non-Prod
        uses: actions/download-artifact@v4
        with:
          name: non-prod-build
          path: gamon-games/build/

      # 2️⃣ Git-tag en push (in root!)
      - name: Create Git tag
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          git tag -a "$TAG" -m "Non-Prod → Prod release"
          git push origin "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      # 3️⃣ Maak GitHub Release (bestand in subfolder)
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: gamon-games/build/game.exe
          tag_name: v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
