name: Godot CI/CD

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamon-games

    steps:
      - uses: actions/checkout@v4

      # Cache Godot
      - uses: actions/cache@v3
        with:
          path: godot
          key: godot-v4.2.2

      # Cache export templates
      - uses: actions/cache@v3
        with:
          path: ~/.local/share/godot/export_templates/4.2.2.stable
          key: godot-templates-v4.2.2

      # Download Godot if needed
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip Godot_v4.2.2-stable_linux.x86_64.zip
          mv Godot_v4.2.2-stable_linux.x86_64 ../godot
          chmod +x ../godot

      # Install export templates if needed
      - name: Install export templates
        if: steps.cache-godot-templates.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          unzip Godot_v4.2.2-stable_export_templates.tpz -d templates
          mv templates/templates/* ~/.local/share/godot/export_templates/4.2.2.stable/

      # Build Web (Threads uit = werkt op Netlify)
      - name: Create build folder
        run: mkdir -p build/web
      - name: Build Web
        run: ../godot --headless --export-release "Web" build/web/index.html

      # Deploy to Netlify
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v1.2
        with:
          publish-dir: gamon-games/build/web        # je build folder
          production-deploy: false                   # preview, geen echte prod
          github-token: ${{ secrets.GITHUB_TOKEN }} # verplicht voor PR comment
          netlify-config-path: ""                    # optioneel, laat leeg voor default
          enable-pull-request-comment: true          # comment in PR

      # Comment preview link in PR
      - name: Comment preview link
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.issue.number;
            const url = `https://your-site-name.netlify.app/?pr=${pr}`;
            github.rest.issues.createComment({
              issue_number: pr,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🎮 PR Preview ready!\n\nPlay it here:\n${url}`
            })
