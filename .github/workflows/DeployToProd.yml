name: Build & Deploy Godot Game

on:
  # Trigger op PR events
  pull_request:
    types: [opened, synchronize, reopened]  # geopend, bijgewerkt, heropend

jobs:
  # ──────────────── Non-Production Build ────────────────
  build-non-prod:
    runs-on: ubuntu-latest
    environment: Non-Production
    defaults:
      run:
        working-directory: gamon-games

    steps:
      - uses: actions/checkout@v4

      - name: Download Godot
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip Godot_v4.6-stable_linux.x86_64.zip
          mv Godot_v4.6-stable_linux.x86_64 ../godot
          chmod +x ../godot

      - name: Install export templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable
          unzip Godot_v4.6-stable_export_templates.tpz -d templates
          mv templates/templates/* ~/.local/share/godot/export_templates/4.6.stable/

      - name: Create build folder
        run: mkdir -p build

      - name: Build Windows
        run: ../godot --headless --export-release "Windows Desktop" build/game.exe

      - uses: actions/upload-artifact@v4
        with:
          name: non-prod-build
          path: gamon-games/build/

  # ──────────────── Promote to Production ────────────────
  promote-to-prod:
    needs: build-non-prod
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v4

      - name: Download build from Non-Prod
        uses: actions/download-artifact@v4
        with:
          name: non-prod-build
          path: gamon-games/build/

      - name: Push Git tag
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          git tag -a "$TAG" -m "Non-Prod → Prod release"
          echo "Pushing tag $TAG..."
          git push https://xpvanderhoek:${{ secrets.GH_PAT }}@github.com/xpvanderhoek/GamonGames.git "$TAG"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: gamon-games/build/game.exe
          tag_name: v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
