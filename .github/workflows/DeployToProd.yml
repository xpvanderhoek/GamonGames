name: Build & Deploy Godot Game

on:
  workflow_dispatch:

jobs:
  # ──────────────── Non-Production Build ────────────────
  build-non-prod:
    runs-on: ubuntu-latest
    environment: Non-Production
    defaults:
      run:
        working-directory: gamon-games

    steps:
      # 1️⃣ Checkout
      - uses: actions/checkout@v4

      # 2️⃣ Download Godot 4.5 headless
      - name: Download Godot 4.5 headless
        run: |
          wget https://downloads.tuxfamily.org/godotengine/4.5/Godot_v4.5-stable_linux_headless.64.zip -O godot-headless.zip
          unzip godot-headless.zip -d godot
          chmod +x godot/Godot_v4.5-stable_linux_headless.64

      # 3️⃣ Download export templates
      - name: Install export templates 4.5
        run: |
          wget https://downloads.tuxfamily.org/godotengine/4.5/Godot_v4.5-stable_export_templates.tpz -O templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.5.stable
          unzip templates.tpz -d templates
          mv templates/templates/* ~/.local/share/godot/export_templates/4.5.stable/

      # 4️⃣ Maak build map
      - name: Create build folder
        run: mkdir -p build

      # 5️⃣ Build Windows
      - name: Build Windows
        run: godot/Godot_v4.5-stable_linux_headless.64 --headless --export-release "Windows Desktop" build/game.exe

      # 6️⃣ Artefact upload
      - uses: actions/upload-artifact@v4
        with:
          name: non-prod-build
          path: gamon-games/build/

  # ──────────────── Promote to Production ────────────────
  promote-to-prod:
    needs: build-non-prod
    runs-on: ubuntu-latest
    environment: Production

    steps:
      # 1️⃣ Checkout
      - uses: actions/checkout@v4

      # 2️⃣ Download artefact
      - name: Download build from Non-Prod
        uses: actions/download-artifact@v4
        with:
          name: non-prod-build
          path: gamon-games/build/

      # 3️⃣ Push Git tag
      - name: Push Git tag
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          git tag -a "$TAG" -m "Non-Prod → Prod release"
          git push https://xpvanderhoek:${{ secrets.GH_PAT }}@github.com/xpvanderhoek/GamonGames.git "$TAG"

      # 4️⃣ Create Release
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: gamon-games/build/game.exe
          tag_name: v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
