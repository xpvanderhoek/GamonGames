name: Godot CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

jobs:

  # ──────────────── PR Preview Build ────────────────
  build-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamon-games

    steps:
      - uses: actions/checkout@v4

      # Download Godot
      - name: Download Godot
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip Godot_v4.2.2-stable_linux.x86_64.zip
          mv Godot_v4.2.2-stable_linux.x86_64 ../godot
          chmod +x ../godot

      # Install export templates
      - name: Install export templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          unzip Godot_v4.2.2-stable_export_templates.tpz -d templates
          mv templates/templates/* ~/.local/share/godot/export_templates/4.2.2.stable/

      # Create build folder
      - name: Create build folder
        run: mkdir -p build/web

      # Build Web version
      - name: Build Web
        run: ../godot --headless --export-release "Web" build/web/index.html

      # Upload artifact (downloadable)
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: gamon-games/build/web/

      # Deploy preview to GitHub Pages
      - name: Deploy preview
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gamon-games/build/web
          destination_dir: pr-${{ github.event.number }}

      # Comment preview link in PR
      - name: Comment preview link
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-${pr}`;
            github.rest.issues.createComment({
              issue_number: pr,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🎮 Preview build ready!\n\nPlay it here:\n${url}`
            });

  # ──────────────── Cleanup preview when PR closes ────────────────
  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove preview folder
        run: |
          PR=${{ github.event.pull_request.number }}
          rm -rf pr-$PR
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Remove preview for PR $PR" || echo "Nothing to commit"
          git push

  # ──────────────── Windows Release Build ────────────────
  build-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamon-games

    steps:
      - uses: actions/checkout@v4

      - name: Download Godot
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip Godot_v4.2.2-stable_linux.x86_64.zip
          mv Godot_v4.2.2-stable_linux.x86_64 ../godot
          chmod +x ../godot

      - name: Install export templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          unzip Godot_v4.2.2-stable_export_templates.tpz -d templates
          mv templates/templates/* ~/.local/share/godot/export_templates/4.2.2.stable/

      - name: Create build folder
        run: mkdir -p build

      - name: Build Windows
        run: ../godot --headless --export-release "Windows Desktop" build/game.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: gamon-games/build/game.exe
