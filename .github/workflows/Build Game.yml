name: Build & Deploy Godot Game

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for this release (e.g. v1.0.0)'
        required: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: gamon-games

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Stel build versie in
      - name: Set build version
        run: echo "BUILD_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV

      # 3️⃣ Download en setup Godot
      - name: Download Godot
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip Godot_v4.2.2-stable_linux.x86_64.zip
          mv Godot_v4.2.2-stable_linux.x86_64 ../godot
          chmod +x ../godot

      # 4️⃣ Download export templates
      - name: Install export templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          unzip Godot_v4.2.2-stable_export_templates.tpz -d templates
          mv templates/templates/* ~/.local/share/godot/export_templates/4.2.2.stable/

      # 5️⃣ Maak build folder
      - name: Create build folder
        run: mkdir -p build

      # 6️⃣ Build Windows
      - name: Build Windows
        run: ../godot --headless --export-release "Windows Desktop" build/game.exe

      # 8️⃣ Upload als tijdelijke artefacts (optioneel)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-builds-${{ env.BUILD_VERSION }}
          path: gamon-games/build/

      # 9️⃣ Maak GitHub Release
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.BUILD_VERSION }}
          release_name: ${{ env.BUILD_VERSION }}
          draft: false
          prerelease: false
          body: "Automatic release of Godot game version ${{ env.BUILD_VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🔟 Upload builds naar de Release
      - name: Upload Windows to Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/game.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux to Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/game.x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Web to Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
