name: Build & Deploy Godot Game

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production  # Dit zorgt voor de approval knop

    defaults:
      run:
        working-directory: gamon-games  # alles draait in deze subfolder

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Download en setup Godot
      - name: Download Godot
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip Godot_v4.2.2-stable_linux.x86_64.zip
          mv Godot_v4.2.2-stable_linux.x86_64 ../godot
          chmod +x ../godot

      # 3️⃣ Download export templates
      - name: Install export templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          unzip Godot_v4.2.2-stable_export_templates.tpz -d templates
          mv templates/templates/* ~/.local/share/godot/export_templates/4.2.2.stable/

      # 4️⃣ Maak build folder aan
      - name: Create build folder
        run: mkdir -p build

      # 5️⃣ Build Windows
      - name: Build Windows
        run: ../godot --headless --export-release "Windows Desktop" build/game.exe

      - name: List build folder
        run: ls -la build/
  
      # 6️⃣ Upload builds als artefacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-builds
          path: build/


      - name: Debug all build files
        run: |
          echo "Current dir: $(pwd)"
          ls -la
          ls -la build/
