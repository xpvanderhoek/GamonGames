name: Update Review Labels

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]

jobs:
  update-review-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Update review labels
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const pr = context.payload.pull_request;
            const prCreator = pr.user.login;

            // 1️⃣ Haal alle reviews op
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            // 2️⃣ Laatste review per reviewer (PR-maker eruit)
            const latestReviews = {};
            for (const review of reviews.data) {
              if (review.user.login !== prCreator) {
                latestReviews[review.user.login] = review.state;
              }
            }

            const allReviewers = Object.keys(latestReviews);

            // 3️⃣ Verwijder oude review-labels
            const oldLabels = pr.labels
              .map(l => l.name)
              .filter(n => n.startsWith("reviewed:") || n === "needs-review");

            for (const label of oldLabels) {
              if (label !== "discord-notified") {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: label
                });
              }
            }

            // 4️⃣ Voeg needs-review toe als er <2 reviewers zijn
            if (allReviewers.length < 2) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ["needs-review"]
              });
            }

            // 5️⃣ Maak labels per reviewer + status-emoji
            for (const [user, state] of Object.entries(latestReviews)) {
              let emoji = "";
              if (state === "APPROVED") emoji = "✅";
              else if (state === "CHANGES_REQUESTED") emoji = "❌";
              else if (state === "COMMENTED") emoji = "💬";
              else emoji = "❓";

              const labelName = `reviewed: ${user} ${emoji}`;

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: [labelName]
              });
            }
