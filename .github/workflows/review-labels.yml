name: Update Review Labels

on:
  pull_request_review:
    types: [submitted]

jobs:
  update-review-label:
    runs-on: ubuntu-latest
    steps:
      - name: Update review label with reviewers and status
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const pr = context.payload.pull_request;

            // 1️⃣ Haal alle reviews op
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            // 2️⃣ Pak laatste review van elke reviewer
            const latestReviews = {};
            for (const review of reviews.data) {
              latestReviews[review.user.login] = review.state;
            }

            // 3️⃣ Maak label text van alle reviewers met status
            let labelName = "reviewed: ";
            const reviewLabels = Object.entries(latestReviews).map(([user, state]) => {
              let emoji = "";
              if (state === "APPROVED") emoji = "✅";
              else if (state === "CHANGES_REQUESTED") emoji = "❌";
              else if (state === "COMMENTED") emoji = "💬";
              else emoji = "❓"; // fallback
              return `${user} ${emoji}`;
            });

            if (reviewLabels.length === 0) {
              labelName = "needs-review";
            } else {
              labelName += reviewLabels.join(", ");
            }

            // 4️⃣ Verwijder oude review labels (alle labels die met "reviewed:" beginnen of "needs-review")
            const oldLabels = pr.labels.map(l => l.name)
              .filter(n => n.startsWith("reviewed:") || n === "needs-review");
            for (const label of oldLabels) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: label
              });
            }

            // 5️⃣ Voeg nieuwe label toe
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: [labelName]
            });
