name: Update Review Status Label

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]

jobs:
  update-review-status:
    runs-on: ubuntu-latest
    steps:
      - name: Update review label and comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const pr = context.payload.pull_request;
            const prCreator = pr.user.login;

            // 1️⃣ Haal alle reviews op
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            // 2️⃣ Laatste review per reviewer (PR-maker eruit)
            const latestReviews = {};
            for (const review of reviews.data) {
              if (review.user.login !== prCreator) {
                latestReviews[review.user.login] = review.state;
              }
            }

            const allReviewers = Object.keys(latestReviews);
            const approvers = Object.values(latestReviews).filter(s => s === "APPROVED");
            const requestedChanges = Object.values(latestReviews).filter(s => s === "CHANGES_REQUESTED");

            // 3️⃣ Bepaal status-label
            let labelName = "";
            if (allReviewers.length < 2) {
              labelName = "needs-review";
            } else {
              if (requestedChanges.length > 0) labelName = "review-status-red";
              else if (approvers.length >= 2) labelName = "review-status-green";
              else labelName = "review-status-yellow";
            }

            // 4️⃣ Verwijder oude labels van deze workflow (behalve andere labels zoals discord-notified)
            const oldLabels = pr.labels
              .map(l => l.name)
              .filter(n => n.startsWith("review-status-") || n === "needs-review");

            for (const label of oldLabels) {
              if (label !== "discord-notified") {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: label
                });
              }
            }

            // 5️⃣ Voeg nieuwe label toe
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: [labelName]
            });

            // 6️⃣ Voeg comment toe met reviewers + emoji
            if (allReviewers.length > 0) {
              const reviewLabels = Object.entries(latestReviews).map(([user, state]) => {
                let emoji = "";
                if (state === "APPROVED") emoji = "✅";
                else if (state === "CHANGES_REQUESTED") emoji = "❌";
                else if (state === "COMMENTED") emoji = "💬";
                else emoji = "❓";
                return `${user} ${emoji}`;
              });

              const commentBody = `### Review status\n${reviewLabels.join("\n")}`;
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }
