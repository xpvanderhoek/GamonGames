name: Update Review Labels

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]

jobs:
  update-review-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Update review labels
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const pr = context.payload.pull_request;
            const prCreator = pr.user.login;

            // 1️⃣ Haal reviews op
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const latestReviews = {};
            for (const review of reviews.data) {
              if (review.user.login !== prCreator) {
                latestReviews[review.user.login] = review.state;
              }
            }

            const allReviewers = Object.keys(latestReviews);

            // 2️⃣ Verwijder oude labels van deze workflow
            const oldLabels = pr.labels
              .map(l => l.name)
              .filter(n => n.startsWith("reviewed:") || n === "needs-review");

            for (const label of oldLabels) {
              if (label !== "discord-notified") {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: label
                });
              }
            }

            // 3️⃣ Needs-review toevoegen bij <2 reviewers
            if (allReviewers.length < 2) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ["needs-review"]
              });
            }

            // 4️⃣ Voeg individuele reviewer labels toe met kleur
            for (const [user, state] of Object.entries(latestReviews)) {
              let emoji = "", color = "";
              if (state === "APPROVED") { emoji = "✅"; color = "0e8a16"; } // groen
              else if (state === "CHANGES_REQUESTED") { emoji = "❌"; color = "d93f0b"; } // rood
              else if (state === "COMMENTED") { emoji = "💬"; color = "ededed"; } // grijs
              else { emoji = "❓"; color = "ededed"; }

              const labelName = `reviewed: ${user} ${emoji}`;

              // Check of label bestaat
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName
                });
              } catch (e) {
                // Label bestaat niet → maak aan
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                  color: color,
                  description: `Review status of ${user}`
                });
              }

              // Voeg label toe aan PR
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: [labelName]
              });
            }
