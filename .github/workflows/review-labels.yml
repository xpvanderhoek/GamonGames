name: PR Auto Assign & Review Labels

on:
  pull_request:
    types: [opened, synchronize]
  pull_request_review:
    types: [submitted]

jobs:
  review-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Update PR labels and assignments
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;

            // 🔥 Altijd verse PR ophalen (FIX)
            let { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const prCreator = pr.user.login;

            // 1️⃣ Haal alle reviews op
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            // 2️⃣ Laatste review per reviewer (excl PR maker)
            const latestReviews = {};
            for (const review of reviews.data) {
              if (review.user.login !== prCreator) {
                latestReviews[review.user.login] = review.state;
              }
            }

            const allReviewers = Object.keys(latestReviews);

            // 3️⃣ Verwijder oude review labels
            const oldLabels = pr.labels
              .map(l => l.name)
              .filter(n => n.startsWith("reviewed:") || n === "needs-review");

            for (const label of oldLabels) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: label
              });
            }

            // 🔄 PR opnieuw ophalen na removals (BELANGRIJK)
            ({ data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            }));

            const existingLabels = pr.labels.map(l => l.name);

            // 4️⃣ Needs-review logica
            if (allReviewers.length >= 2) {
              if (existingLabels.includes("needs-review")) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: "needs-review"
                });
              }
            } else {
              if (!existingLabels.includes("needs-review")) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: ["needs-review"]
                });
              }
            }

            // 5️⃣ Reviewer labels toevoegen
            for (const [user, state] of Object.entries(latestReviews)) {
              let emoji = "";
              let color = "ededed";

              if (state === "APPROVED") {
                emoji = "✅";
                color = "0e8a16";
              } else if (state === "CHANGES_REQUESTED") {
                emoji = "❌";
                color = "d93f0b";
              } else if (state === "COMMENTED") {
                emoji = "💬";
              } else {
                emoji = "❓";
              }

              const labelName = `reviewed: ${user} ${emoji}`;

              // Label bestaat?
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName
                });
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                  color: color,
                  description: `Review status of ${user}`
                });
              }

              // Voeg toe aan PR
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: [labelName]
              });
            }

            // 6️⃣ Assign PR creator als <2 reviewers
            if (allReviewers.length < 2) {
              const assignees = pr.assignees.map(a => a.login);

              if (!assignees.includes(prCreator)) {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  assignees: [prCreator]
                });
              }
            }
