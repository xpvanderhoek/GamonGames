name: Update Review Status Label

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]

jobs:
  update-review-status:
    runs-on: ubuntu-latest
    steps:
      - name: Update review label with status
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const pr = context.payload.pull_request;

            const prCreator = pr.user.login;

            // 1️⃣ Haal alle reviews op
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            // 2️⃣ Laatste review per reviewer
            const latestReviews = {};
            for (const review of reviews.data) {
              if (review.user.login !== prCreator) { // PR-maker filteren
                latestReviews[review.user.login] = review.state;
              }
            }

            const allReviewers = Object.keys(latestReviews);
            const approvers = Object.values(latestReviews).filter(s => s === "APPROVED");
            const requestedChanges = Object.values(latestReviews).filter(s => s === "CHANGES_REQUESTED");

            // 3️⃣ Bepaal label
            let labelName = "";

            if (allReviewers.length < 2) {
              labelName = "needs-review";
            } else {
              if (requestedChanges.length > 0) {
                labelName = `review-status: 🔴 ${requestedChanges.length} requested change(s)`;
              } else if (approvers.length >= 2) {
                labelName = `review-status: 🟢 ${approvers.length} approvals`;
              } else {
                labelName = `review-status: ⚪ ${approvers.length} approval(s)`;
              }
            }

            // 4️⃣ Verwijder oude labels
            const oldLabels = pr.labels.map(l => l.name)
              .filter(n => n.startsWith("review-status:") || n === "needs-review");
            for (const label of oldLabels) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: label
              });
            }

            // 5️⃣ Voeg nieuwe label toe
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: [labelName]
            });
