name: Remove needs-review after approvals

on:
  pull_request_review:
    types: [submitted]

jobs:
  check-approvals:
    runs-on: ubuntu-latest

    steps:
      - name: Check approval count
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            // Pak alleen de laatste review per gebruiker
            const latestReviews = {};
            for (const review of reviews.data) {
              latestReviews[review.user.login] = review.state;
            }

            // Tel approvals
            const approvals = Object.values(latestReviews)
              .filter(state => state === "APPROVED").length;

            console.log("Aantal approvals:", approvals);

            if (approvals >= 2) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                name: "needs-review"
              });
            }
