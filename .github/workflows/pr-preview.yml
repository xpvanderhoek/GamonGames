name: PR Preview Build

on:
  pull_request:
    branches:
      - main

jobs:
  build-pr-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamon-games

    steps:
      # 1️⃣ Checkout
      - uses: actions/checkout@v4

      # 2️⃣ Download Godot 4.6 full (van GitHub releases)
      - name: Download Godot 4.6 full
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip Godot_v4.6-stable_linux.x86_64.zip
          mkdir -p godot
          mv Godot_v4.6-stable_linux.x86_64 godot/
          chmod +x godot/Godot_v4.6-stable_linux.x86_64

      # 3️⃣ Install export templates 4.6 (van GitHub releases)
      - name: Install export templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable
          unzip Godot_v4.6-stable_export_templates.tpz -d templates
          mv templates/templates/* ~/.local/share/godot/export_templates/4.6.stable/

      # 4️⃣ Maak HTML5 build folder
      - name: Create build folder
        run: mkdir -p build/html5

      # 5️⃣ Build HTML5
      - name: Build HTML5
        run: godot/Godot_v4.6-stable_linux.x86_64 --export "HTML5" build/html5/index.html

      # 6️⃣ Deploy naar GitHub Pages per PR
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/html5
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true

      # 7️⃣ Comment PR met preview link
      - name: Comment PR with preview link
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🎮 **PR Preview Build is klaar!**
            Bekijk de live preview hier:  
            👉 https://<YOUR_GITHUB_USERNAME>.github.io/<YOUR_REPO_NAME>/pr-${{ github.event.pull_request.number }}/index.html
