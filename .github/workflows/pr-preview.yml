name: Build & Deploy Godot HTML5

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamon-games

    steps:
      # 1️⃣ Checkout code
      - uses: actions/checkout@v4

      # 2️⃣ Download Godot 4.6 full
      - name: Download Godot 4.6
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip -O godot.zip
          unzip godot.zip -d godot
          chmod +x godot/Godot_v4.6-stable_linux.x86_64

      # 3️⃣ Install export templates
      - name: Install export templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable
          unzip Godot_v4.6-stable_export_templates.tpz -d templates
          mv templates/templates/* ~/.local/share/godot/export_templates/4.6.stable/

      # 4️⃣ Create build folder
      - name: Create HTML5 build folder
        run: mkdir -p build/html5

      # 5️⃣ Export HTML5 build
      - name: Export HTML5
        run: godot/Godot_v4.6-stable_linux.x86_64 --headless --export-release "Web" build/html5/index.html

      # 6️⃣ Install Netlify CLI
      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      # 7️⃣ Deploy to Netlify
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            PR_NUM=${{ github.event.pull_request.number }}
            DEPLOY_SUBDOMAIN="pr-${PR_NUM}--gamongames"
            netlify deploy --dir=build/html5 --site=$NETLIFY_SITE_ID --prod --alias=$DEPLOY_SUBDOMAIN
            echo "Preview URL: https://$DEPLOY_SUBDOMAIN.netlify.app"
          else
            # Production deploy from main branch
            netlify deploy --dir=build/html5 --site=$NETLIFY_SITE_ID --prod
          fi

      # 8️⃣ Comment PR with preview link
      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🎮 **PR Preview Build is klaar!**
            Bekijk de live preview hier:  
            👉 https://pr-${{ github.event.pull_request.number }}--gamongames.netlify.app
