name: PR Preview Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # 💡 Gebruik een container met Godot 4.6 headless
      - name: Set up Godot 4.6 container
        uses: addnab/docker-run-action@v3
        with:
          image: ghcr.io/godotengine/godot:4.6-headless
          options: --entrypoint ""
          run: |
            mkdir -p build
            ./godot --headless --export "HTML5" build/index.html

      # 📤 Deploy naar GitHub Pages (PR-specifieke folder)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true

      # 💬 Voeg een comment toe aan de PR met de preview link
      - name: Comment PR with preview link
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🎮 **PR Preview Build is gereed!**
            👉 [Bekijk de preview](https://<USERNAME>.github.io/<REPO>/pr-${{ github.event.pull_request.number }}/index.html)
