name: Discord PR Notifier

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check merge conflicts
        run: |
          MERGEABLE_STATE="${{ github.event.pull_request.mergeable_state }}"
          if [ "$MERGEABLE_STATE" != "clean" ]; then
            echo "⚠️ PR heeft nog steeds een merge conflict, geen notificatie"
            exit 0
          fi

      - name: Check if already notified
        uses: actions/github-script@v7
        id: check_label
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name)
            return labels.includes("discord-notified")
      - name: Send Discord notification
        if: steps.check_label.outputs.result == 'false'
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          PR_BRANCH="${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}"

          curl -s -H "Content-Type: application/json" \
            -X POST \
            -d "{
              \"content\": \"🚀 Nieuwe Pull Request! $PR_TITLE <@&1478774800062091294>\",
              \"thread_name\": \"$PR_TITLE\",
              \"allowed_mentions\": {\"parse\": [\"roles\"]},
              \"embeds\": [
                {
                  \"title\": \"$PR_TITLE\",
                  \"url\": \"$PR_URL\",
                  \"color\": 5814783,
                  \"fields\": [
                    {\"name\": \"👤 Maker\", \"value\": \"$PR_AUTHOR\", \"inline\": true},
                    {\"name\": \"🌿 Branch\", \"value\": \"$PR_BRANCH\", \"inline\": true}
                  ]
                }
              ]
            }" \
            "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Add notified label
        if: steps.check_label.outputs.result == 'false'
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: discord-notified
