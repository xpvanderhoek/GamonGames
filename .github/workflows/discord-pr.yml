name: Discord Forum PR Notifier

on:
  pull_request:
    types: [opened, synchronize, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Cache PR thread map
        uses: actions/cache@v3
        with:
          path: .github/pr_thread_map.json
          key: pr-thread-map

      - name: Ensure thread map exists
        run: |
          THREAD_FILE=".github/pr_thread_map.json"
          mkdir -p $(dirname "$THREAD_FILE")
          if [ ! -f "$THREAD_FILE" ]; then
            echo "{}" > "$THREAD_FILE"
          fi

      - name: Send PR notification to Discord (with debug + THREAD_ID check)
        run: |
          set -x  # DEBUG: laat alle commands zien
          THREAD_FILE=".github/pr_thread_map.json"
          PR_NUM=${{ github.event.pull_request.number }}
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          PR_BRANCH="${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}"
          ACTION="${{ github.event.action }}"

          make_embed() {
            COLOR=$1
            echo "{\"title\":\"$PR_TITLE\",\"url\":\"$PR_URL\",\"color\":$COLOR,\"fields\":[{\"name\":\"👤 Auteur\",\"value\":\"$PR_AUTHOR\",\"inline\":true},{\"name\":\"🌿 Branch\",\"value\":\"$PR_BRANCH\",\"inline\":true}]}"
          }

          # --- DEBUG: print JSON en thread info ---
          echo "THREAD_FILE exists: $(test -f $THREAD_FILE && echo yes || echo no)"
          echo "PR_NUM=$PR_NUM"
          echo "THREAD_FILE contents:"
          cat $THREAD_FILE

          THREAD_ID=$(jq -r --arg pr "$PR_NUM" '.[$pr] // empty' $THREAD_FILE)
          echo "THREAD_ID=$THREAD_ID"
          # --- DEBUG END ---

          if [ "$ACTION" == "opened" ] || [ -z "$THREAD_ID" ]; then
            RESPONSE=$(curl -s -H "Content-Type: application/json" \
              -X POST \
              -d "{\"content\":\"<@&1478774800062091294> 🚀 Nieuwe Pull Request!\",\"thread_name\":\"$PR_TITLE\",\"allowed_mentions\":{\"parse\":[\"roles\"]},\"embeds\":[$(make_embed 5814783)]}" \
              "${{ secrets.DISCORD_WEBHOOK }}")

            echo "Discord response (opened): $RESPONSE"
            THREAD_ID=$(echo $RESPONSE | jq -r '.id')

            # Fail direct als thread_id leeg is
            if [ -z "$THREAD_ID" ] || [ "$THREAD_ID" == "null" ]; then
              echo "ERROR: THREAD_ID is empty after creating thread!"
              exit 1
            fi

            jq --arg pr "$PR_NUM" --arg tid "$THREAD_ID" '. + {($pr): $tid}' $THREAD_FILE > tmp.$$.json && mv tmp.$$.json $THREAD_FILE

          elif [ "$ACTION" == "synchronize" ] || [ "$ACTION" == "closed" ]; then
            # Check THREAD_ID voordat je naar Discord pusht
            if [ -z "$THREAD_ID" ] || [ "$THREAD_ID" == "null" ]; then
              echo "ERROR: THREAD_ID is empty for $ACTION action! Cannot post to Discord."
              exit 1
            fi

            if [ "$ACTION" == "synchronize" ]; then
              RESPONSE=$(curl -s -H "Content-Type: application/json" \
                -X POST \
                -d "{\"content\":\"🔄 Nieuwe commits toegevoegd aan PR: $PR_TITLE\",\"thread_id\":$THREAD_ID,\"allowed_mentions\":{\"parse\":[\"roles\"]}}" \
                "${{ secrets.DISCORD_WEBHOOK }}")
              echo "Discord response (synchronize): $RESPONSE"

            elif [ "$ACTION" == "closed" ]; then
              if [ "${{ github.event.pull_request.merged }}" == "true" ]; then
                RESPONSE=$(curl -s -H "Content-Type: application/json" \
                  -X POST \
                  -d "{\"content\":\"✅ PR gemerged: $PR_TITLE\",\"embeds\":[$(make_embed 3066993)],\"thread_id\":$THREAD_ID,\"allowed_mentions\":{\"parse\":[\"roles\"]}}" \
                  "${{ secrets.DISCORD_WEBHOOK }}")
                echo "Discord response (closed merged): $RESPONSE"
              else
                RESPONSE=$(curl -s -H "Content-Type: application/json" \
                  -X POST \
                  -d "{\"content\":\"❌ PR gesloten zonder merge: $PR_TITLE\",\"embeds\":[$(make_embed 15158332)],\"thread_id\":$THREAD_ID,\"allowed_mentions\":{\"parse\":[\"roles\"]}}" \
                  "${{ secrets.DISCORD_WEBHOOK }}")
                echo "Discord response (closed not merged): $RESPONSE"
              fi
            fi
          fi
